<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Room — Afristay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: #FAF9F6;
      color: #1F2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ----- sticky header ----- */
    .header {
      position: sticky;
      top: 0;
      width: 100%;
      background: #FFFFFF;
      padding: 16px 32px;
      text-align: center;
      border-bottom: 1px solid #E5E7EB;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .header .hotel-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #183A2D;
      letter-spacing: -0.3px;
    }

    .header .hotel-location {
      font-size: 13px;
      color: #6B7280;
      margin-top: 2px;
    }

    /* ----- main content ----- */
    main {
      flex: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
    }

    /* ----- search panel ----- */
    .search-panel {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #E5E7EB;
      box-shadow: 0 2px 8px rgba(24, 58, 45, 0.04);
    }

    .search-panel .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .search-panel label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .search-panel input,
    .search-panel select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      background: #FAF9F6;
      transition: border 0.2s, box-shadow 0.2s;
      color: #1F2937;
    }

    .search-panel input:focus,
    .search-panel select:focus {
      outline: none;
      border-color: #183A2D;
      box-shadow: 0 0 0 3px rgba(24, 58, 45, 0.08);
      background: #FFFFFF;
    }

    .btn-primary {
      width: 100%;
      background: #183A2D;
      color: #FAF9F6;
      border: none;
      padding: 13px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(24, 58, 45, 0.15);
    }

    .btn-primary:hover {
      background: #0f2b21;
      box-shadow: 0 6px 14px rgba(24, 58, 45, 0.25);
      transform: scale(1.01);
    }

    /* ----- room list ----- */
    .room-list {
      display: grid;
      gap: 12px;
    }

    .room-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px 22px;
      border: 1px solid #E5E7EB;
      box-shadow: 0 2px 8px rgba(24, 58, 45, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      transition: all 0.2s;
    }

    .room-card:hover {
      box-shadow: 0 8px 24px rgba(24, 58, 45, 0.06);
      border-color: #C8A86B;
    }

    .room-card .room-num {
      font-size: 18px;
      font-weight: 700;
      color: #183A2D;
    }

    .room-card .room-type {
      font-size: 13px;
      color: #6B7280;
    }

    .room-card .room-rate {
      font-size: 16px;
      font-weight: 700;
      color: #C8A86B;
    }

    .room-card button {
      background: #183A2D;
      color: #FAF9F6;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(24, 58, 45, 0.15);
    }

    .room-card button:hover {
      background: #0f2b21;
      box-shadow: 0 4px 12px rgba(24, 58, 45, 0.25);
      transform: scale(1.02);
    }

    /* ----- states ----- */
    .empty-state,
    .loading,
    .error-state {
      text-align: center;
      padding: 48px 20px;
      color: #9CA3AF;
      font-size: 15px;
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #E5E7EB;
    }

    .error-state {
      color: #D9534F;
    }

    /* ----- modal ----- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #E5E7EB;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.15);
    }

    .modal h3 {
      font-size: 22px;
      font-weight: 700;
      color: #183A2D;
      margin-bottom: 4px;
    }

    .modal .modal-sub {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 20px;
    }

    .modal label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 5px;
      margin-top: 16px;
    }

    .modal input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      background: #FAF9F6;
      transition: border 0.2s, box-shadow 0.2s;
      color: #1F2937;
    }

    .modal input:focus {
      outline: none;
      border-color: #183A2D;
      box-shadow: 0 0 0 3px rgba(24, 58, 45, 0.08);
      background: #FFFFFF;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #FAF9F6;
      border: 1px solid #E5E7EB;
      color: #1F2937;
    }

    .btn-cancel:hover {
      background: #F3F4F6;
    }

    .btn-confirm {
      background: #183A2D;
      color: #FAF9F6;
      border: none;
      box-shadow: 0 4px 10px rgba(24, 58, 45, 0.15);
    }

    .btn-confirm:hover {
      background: #0f2b21;
      box-shadow: 0 6px 14px rgba(24, 58, 45, 0.25);
      transform: scale(1.02);
    }

    .error-msg {
      color: #D9534F;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      background: #FDE8E7;
      padding: 10px 14px;
      border-radius: 10px;
      border-left: 4px solid #D9534F;
    }

    /* ----- confirmation screen ----- */
    .confirm-screen {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid #E5E7EB;
      box-shadow: 0 2px 8px rgba(24, 58, 45, 0.04);
    }

    .confirm-screen .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .confirm-screen h2 {
      font-size: 22px;
      font-weight: 700;
      color: #183A2D;
      margin-bottom: 8px;
    }

    .confirm-screen p {
      color: #6B7280;
      font-size: 15px;
      margin-bottom: 6px;
      line-height: 1.6;
    }

    .confirm-screen .highlight {
      font-weight: 600;
      color: #183A2D;
    }

    .btn-whatsapp {
      display: inline-block;
      margin-top: 24px;
      background: #25D366;
      color: #FFFFFF;
      padding: 12px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.25);
    }

    .btn-whatsapp:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 14px rgba(37, 211, 102, 0.35);
    }

    /* ----- footer ----- */
    .footer {
      margin-top: 48px;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #E5E7EB;
      background: #FFFFFF;
    }

    .footer-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #6B7280;
    }

    .footer-content .afristay {
      font-weight: 700;
      color: #183A2D;
    }

    .footer-content .afristay span {
      color: #C8A86B;
    }

    /* ----- responsive ----- */
    @media (max-width: 640px) {
      .header {
        padding: 12px 16px;
      }

      .header .hotel-name {
        font-size: 1.3rem;
      }

      main {
        padding: 16px;
      }

      .search-panel {
        padding: 16px;
      }

      .search-panel .row {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .room-card {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .room-card button {
        width: 100%;
        text-align: center;
      }

      .modal {
        padding: 24px;
        margin: 16px;
      }

      .confirm-screen {
        padding: 28px 20px;
      }

      .confirm-screen .icon {
        font-size: 36px;
      }

      .confirm-screen h2 {
        font-size: 19px;
      }

      .footer {
        padding: 16px;
      }

      .footer-content {
        font-size: 12px;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 400px) {
      .header .hotel-name {
        font-size: 1.1rem;
      }

      .btn-whatsapp {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="hotel-name" id="hotelNameHeader">Loading hotel...</div>
    <div class="hotel-location" id="hotelLocationHeader"></div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <div id="pageContent">
      <div class="loading">Loading...</div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-content">
      <span>Powered by</span>
      <span class="afristay">AFRI<span>STAY</span></span>
      <span>• Hotel Management Platform</span>
    </div>
  </footer>

  <!-- BOOKING MODAL -->
  <div class="modal-overlay" id="bookingModalOverlay">
    <div class="modal">
      <h3 id="bookingModalTitle">Book This Room</h3>
      <p class="modal-sub" id="bookingModalSub"></p>

      <form id="bookingForm">
        <label>Full Name</label>
        <input type="text" id="guestName" required placeholder="e.g. John Doe">

        <label>Phone Number (WhatsApp)</label>
        <input type="tel" id="guestPhone" required placeholder="080...">

        <label>Email (optional)</label>
        <input type="email" id="guestEmail" placeholder="you@example.com">

        <!-- Honeypot field — invisible to real users, but bots often auto-fill every field they find -->
        <input type="text" id="websiteField" name="website" autocomplete="off" tabindex="-1" style="position:absolute; left:-9999px; opacity:0;">

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeBookingModal()">Cancel</button>
          <button type="submit" class="btn-confirm">Request Booking</button>
        </div>
        <p class="error-msg" id="bookingError"></p>
      </form>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script>
    let hotelId = null;
    let hotelInfo = null;
    let selectedRoom = null;

    async function init() {
      const params = new URLSearchParams(window.location.search);
      hotelId = params.get("hotel");

      if (!hotelId) {
        document.getElementById("hotelNameHeader").textContent = "Hotel Not Found";
        document.getElementById("pageContent").innerHTML = `<div class="error-state">No hotel specified. Please use the booking link provided by your hotel.</div>`;
        return;
      }

      const { data: hotel, error } = await supabaseClient
        .from("hotels")
        .select("id, name, city, address, phone")
        .eq("id", hotelId)
        .single();

      if (error || !hotel) {
        document.getElementById("hotelNameHeader").textContent = "Hotel Not Found";
        document.getElementById("pageContent").innerHTML = `<div class="error-state">This hotel isn't available for online booking right now.</div>`;
        return;
      }

      hotelInfo = hotel;
      document.getElementById("hotelNameHeader").textContent = hotel.name;
      document.getElementById("hotelLocationHeader").textContent = hotel.city ? `${hotel.city} — Book Your Stay` : "Book Your Stay";

      renderSearchForm();
    }

    function renderSearchForm() {
      const today = new Date().toISOString().split("T")[0];
      const tomorrow = new Date(Date.now() + 86400000).toISOString().split("T")[0];

      document.getElementById("pageContent").innerHTML = `
        <div class="search-panel">
          <div class="row">
            <div>
              <label>Check-in</label>
              <input type="date" id="searchCheckIn" value="${today}" min="${today}">
            </div>
            <div>
              <label>Check-out</label>
              <input type="date" id="searchCheckOut" value="${tomorrow}" min="${tomorrow}">
            </div>
          </div>
          <label>Room Type</label>
          <select id="searchType">
            <option value="">All Types</option>
            <option value="standard">Standard</option>
            <option value="deluxe">Deluxe</option>
            <option value="family">Family</option>
            <option value="business">Business Suite</option>
          </select>
          <button class="btn-primary" onclick="searchRooms()">Search Available Rooms</button>
        </div>
        <div class="room-list" id="roomList"></div>
      `;
    }

    async function searchRooms() {
      const checkIn = document.getElementById("searchCheckIn").value;
      const checkOut = document.getElementById("searchCheckOut").value;
      const roomType = document.getElementById("searchType").value || null;

      if (!checkIn || !checkOut) {
        alert("Please select both dates.");
        return;
      }
      if (checkOut <= checkIn) {
        alert("Check-out must be after check-in.");
        return;
      }

      const roomList = document.getElementById("roomList");
      roomList.innerHTML = `<div class="loading">Searching...</div>`;

      const { data: rooms, error } = await supabaseClient.rpc("search_available_rooms", {
        p_hotel_id: hotelId,
        p_check_in: checkIn,
        p_check_out: checkOut,
        p_room_type: roomType,
      });

      if (error) {
        roomList.innerHTML = `<div class="error-state">Error searching rooms. Please try again.</div>`;
        return;
      }

      if (!rooms.length) {
        roomList.innerHTML = `<div class="empty-state">No rooms available for these dates. Try different dates.</div>`;
        return;
      }

      roomList.innerHTML = rooms.map(r => `
        <div class="room-card">
          <div>
            <div class="room-num">Room ${r.room_number}</div>
            <div class="room-type">${capitalize(r.room_type)}</div>
            <div class="room-rate">₦${Number(r.rate_per_night).toLocaleString()}/night</div>
          </div>
          <button onclick='openBookingModal(${JSON.stringify(r)}, "${checkIn}", "${checkOut}")'>Book Now</button>
        </div>
      `).join("");
    }

    function openBookingModal(room, checkIn, checkOut) {
      selectedRoom = { ...room, checkIn, checkOut };
      document.getElementById("bookingModalTitle").textContent = `Book Room ${room.room_number}`;
      document.getElementById("bookingModalSub").textContent =
        `${capitalize(room.room_type)} • ${checkIn} to ${checkOut} • ₦${Number(room.rate_per_night).toLocaleString()}/night`;
      document.getElementById("bookingError").style.display = "none";
      document.getElementById("bookingModalOverlay").classList.add("open");
    }

    function closeBookingModal() {
      document.getElementById("bookingModalOverlay").classList.remove("open");
      document.getElementById("bookingForm").reset();
      selectedRoom = null;
    }

    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("bookingError");
      errorMsg.style.display = "none";

      // Honeypot check — if this hidden field got filled, it's almost certainly a bot.
      if (document.getElementById("websiteField").value.trim() !== "") {
        return;
      }

      const full_name = document.getElementById("guestName").value.trim();
      const phone = document.getElementById("guestPhone").value.trim();
      const email = document.getElementById("guestEmail").value.trim() || null;

      try {
        const { data, error } = await supabaseClient.rpc("create_guest_booking", {
          p_hotel_id: hotelId,
          p_room_id: selectedRoom.id,
          p_check_in: selectedRoom.checkIn,
          p_check_out: selectedRoom.checkOut,
          p_guest_name: full_name,
          p_guest_phone: phone,
          p_guest_email: email,
        });

        if (error) throw error;

        showConfirmation(data, full_name, phone);

      } catch (err) {
        errorMsg.textContent = err.message || "Failed to create booking. Please try again.";
        errorMsg.style.display = "block";
      }
    });

    function showConfirmation(data, guestName, guestPhone) {
      closeBookingModal();

      const hotelPhone = hotelInfo?.phone?.replace(/\D/g, "");
      let waLink = "#";
      if (hotelPhone) {
        let clean = hotelPhone.startsWith("0") ? "234" + hotelPhone.slice(1) : hotelPhone;
        const message = `Hello, I just requested a booking online for Room ${data.room_number} (${data.nights} night${data.nights > 1 ? "s" : ""}), total ₦${Number(data.total).toLocaleString()}. My name is ${guestName}. Please confirm and let me know how to pay.`;
        waLink = `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
      }

      document.getElementById("pageContent").innerHTML = `
        <div class="confirm-screen">
          <div class="icon">✅</div>
          <h2>Booking Requested!</h2>
          <p><span class="highlight">Room ${data.room_number}</span> • ${data.nights} night${data.nights > 1 ? "s" : ""}</p>
          <p>Total: <span class="highlight">₦${Number(data.total).toLocaleString()}</span></p>
          <p style="margin-top:16px">Your booking is <span class="highlight">pending confirmation</span>. The hotel will reach out to arrange payment and confirm your stay.</p>
          ${hotelPhone ? `<a class="btn-whatsapp" href="${waLink}" target="_blank">💬 Message the Hotel on WhatsApp</a>` : ""}
        </div>
      `;
    }

    function capitalize(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    init();
  </script>

</body>
</html>
