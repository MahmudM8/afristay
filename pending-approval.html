<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approval — Afristay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: #FAF9F6;
      /* Warm White */
      color: #1F2937;
      /* Dark Charcoal */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ----- sticky navigation bar ----- */
    .navbar {
      position: sticky;
      top: 0;
      width: 100%;
      background: #FFFFFF;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #E5E7EB;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      gap: 12px;
    }

    .hotel-brand {
      display: flex;
      flex-direction: column;
    }

    .hotel-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #183A2D;
      line-height: 1.2;
    }

    .hotel-role {
      font-size: 12px;
      color: #9CA3AF;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-user {
      font-size: 14px;
      font-weight: 500;
      color: #1F2937;
    }

    .nav-user span {
      color: #C8A86B;
      font-weight: 600;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #E5E7EB;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      color: #1F2937;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #183A2D;
      color: #FAF9F6;
      border-color: #183A2D;
    }

    /* ----- main content ----- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      width: 100%;
    }

    /* ----- card ----- */
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      border: 1px solid #E5E7EB;
      box-shadow: 0 12px 32px rgba(24, 58, 45, 0.06);
      text-align: center;
      transition: box-shadow 0.2s;
    }

    .card:hover {
      box-shadow: 0 16px 48px rgba(24, 58, 45, 0.08);
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: #FAF9F6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      border: 2px solid #E5E7EB;
    }

    .icon {
      font-size: 40px;
      line-height: 1;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #183A2D;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: #6B7280;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }

    .status-badge.pending {
      background: #FEF3C7;
      color: #D4A017;
    }

    .status-badge.rejected {
      background: #FEE2E2;
      color: #D9534F;
    }

    .status-badge.approved {
      background: #DCFCE7;
      color: #2E7D32;
    }

    .status-message {
      font-size: 14px;
      color: #6B7280;
      margin-top: 8px;
    }

    .btn-outline {
      margin-top: 28px;
      padding: 12px 32px;
      background: transparent;
      border: 2px solid #183A2D;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: #183A2D;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: #183A2D;
      color: #FAF9F6;
      box-shadow: 0 4px 12px rgba(24, 58, 45, 0.2);
      transform: scale(1.02);
    }

    .btn-outline:active {
      transform: scale(0.98);
    }

    /* ----- footer ----- */
    .footer {
      margin-top: auto;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #E5E7EB;
      background: #FFFFFF;
    }

    .footer-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #6B7280;
    }

    .footer-content .afristay {
      font-weight: 700;
      color: #183A2D;
    }

    .footer-content .afristay span {
      color: #C8A86B;
    }

    /* ----- responsive ----- */
    @media (max-width: 640px) {
      .navbar {
        padding: 12px 16px;
        flex-wrap: wrap;
      }

      .hotel-name {
        font-size: 1.1rem;
      }

      .card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 20px;
      }

      .icon-wrapper {
        width: 64px;
        height: 64px;
      }

      .icon {
        font-size: 32px;
      }

      .footer {
        padding: 16px;
      }

      .footer-content {
        font-size: 12px;
        flex-wrap: wrap;
      }

      .nav-user {
        font-size: 12px;
      }

      .btn-logout {
        font-size: 12px;
        padding: 6px 14px;
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 24px 16px;
      }

      .btn-outline {
        width: 100%;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== STICKY NAVIGATION ===== -->
  <nav class="navbar">
    <div class="hotel-brand">
      <div class="hotel-name" id="hotelName">Afristay</div>
      <div class="hotel-role">Hotel Registration</div>
    </div>

    <div class="nav-right">
      <div class="nav-user" id="staffNameLabel">Loading...</div>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <div class="card">
      <div class="icon-wrapper">
        <div class="icon" id="statusIcon">⏳</div>
      </div>
      <h1 id="titleText">Your Hotel Is Awaiting Approval</h1>
      <p class="subtitle" id="bodyText">Thanks for signing up! Our team is reviewing your hotel registration. You'll be able to log in fully once it's approved — this usually doesn't take long.</p>
      <div id="statusBadgeWrap"></div>
      <p class="status-message" id="statusMessage"></p>
      <button class="btn-outline" onclick="logout()">Log Out</button>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-content">
      <span>Powered by</span>
      <span class="afristay">AFRI<span>STAY</span></span>
      <span>• Hotel Management Platform</span>
    </div>
  </footer>

  <script src="js/supabase-config.js"></script>
  <script>
    async function checkStatus() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }

      // Get staff record with hotel details
      const { data: staffRecord, error: staffError } = await supabaseClient
        .from("staff")
        .select(`
          full_name,
          role,
          hotels ( 
            id,
            name,
            approval_status 
          )
        `)
        .eq("auth_user_id", session.user.id)
        .single();

      if (staffError || !staffRecord) {
        console.error("Error fetching staff record:", staffError);
        return;
      }

      const hotel = staffRecord.hotels;
      const status = hotel?.approval_status;

      // Update hotel name in navbar
      if (hotel?.name) {
        document.getElementById("hotelName").textContent = hotel.name;
      }

      // Update staff name
      document.getElementById("staffNameLabel").innerHTML = 
        `${staffRecord.full_name || "Staff"} <span>— ${capitalize(staffRecord.role || "staff")}</span>`;

      const titleEl = document.getElementById("titleText");
      const bodyEl = document.getElementById("bodyText");
      const badgeWrap = document.getElementById("statusBadgeWrap");
      const messageEl = document.getElementById("statusMessage");
      const iconEl = document.getElementById("statusIcon");

      if (status === "approved") {
        // Already approved — redirect to login which will route to dashboard
        window.location.href = "login.html";
        return;
      }

      if (status === "rejected") {
        titleEl.textContent = "Registration Not Approved";
        bodyEl.textContent = "Unfortunately your hotel registration wasn't approved. Please contact support for more details.";
        badgeWrap.innerHTML = `<span class="status-badge rejected">Rejected</span>`;
        messageEl.textContent = "Please reach out to our support team for assistance.";
        iconEl.textContent = "❌";
      } else {
        // Pending or null
        titleEl.textContent = "Your Hotel Is Awaiting Approval";
        bodyEl.textContent = "Thanks for signing up! Our team is reviewing your hotel registration. You'll be able to log in fully once it's approved — this usually doesn't take long.";
        badgeWrap.innerHTML = `<span class="status-badge pending">Pending Review</span>`;
        messageEl.textContent = "We'll notify you as soon as your hotel is approved.";
        iconEl.textContent = "⏳";
      }
    }

    function capitalize(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    }

    checkStatus();
  </script>

</body>
</html>
