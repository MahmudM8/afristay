<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Afristay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: #FAF9F6;
      /* Warm White */
      color: #1F2937;
      /* Dark Charcoal */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ----- sticky navigation bar ----- */
    .navbar {
      position: sticky;
      top: 0;
      width: 100%;
      background: #183A2D;
      /* Deep Forest Green */
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      gap: 12px;
    }

    .logo-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo-image {
      height: 85px;
      width: auto;
      display: block;
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #FAF9F6;
      /* Warm White */
    }

    .logo-text span {
      color: #C8A86B;
      /* Soft Gold */
    }

    .logo-link.has-image .logo-text {
      display: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 30px;
      transition: all 0.2s;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FAF9F6;
    }

    .nav-link.primary {
      background: #C8A86B;
      color: #183A2D;
      box-shadow: 0 4px 10px rgba(200, 168, 107, 0.3);
    }

    .nav-link.primary:hover {
      background: #d4b87a;
      box-shadow: 0 6px 14px rgba(200, 168, 107, 0.4);
      transform: scale(1.02);
    }

    /* ----- main content ----- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      width: 100%;
    }

    /* ----- card ----- */
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      border: 1px solid #E5E7EB;
      box-shadow: 0 12px 32px rgba(24, 58, 45, 0.08);
      transition: box-shadow 0.2s;
    }

    .card:hover {
      box-shadow: 0 16px 48px rgba(24, 58, 45, 0.12);
    }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .card-header .shield {
      display: inline-block;
      background: #183A2D;
      color: #FAF9F6;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      line-height: 64px;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(24, 58, 45, 0.2);
    }

    .card h1 {
      font-size: 26px;
      font-weight: 700;
      color: #183A2D;
      letter-spacing: -0.3px;
    }

    .card .subtitle {
      color: #6B7280;
      font-size: 14px;
      margin-top: 4px;
    }

    .card .badge-admin {
      display: inline-block;
      background: #C8A86B;
      color: #183A2D;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    /* ----- form elements ----- */
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 5px;
      margin-top: 18px;
      letter-spacing: 0.3px;
    }

    label:first-of-type {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      font-size: 15px;
      background: #FAF9F6;
      transition: border 0.2s, box-shadow 0.2s;
      color: #1F2937;
    }

    input:focus {
      outline: none;
      border-color: #183A2D;
      box-shadow: 0 0 0 3px rgba(24, 58, 45, 0.08);
      background: #FFFFFF;
    }

    input::placeholder {
      color: #9CA3AF;
      font-weight: 400;
      opacity: 0.7;
    }

    /* ----- button ----- */
    button {
      width: 100%;
      margin-top: 28px;
      padding: 14px 18px;
      background: #183A2D;
      /* Deep Forest Green */
      color: #FAF9F6;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(24, 58, 45, 0.15);
    }

    button:hover {
      background: #0f2b21;
      box-shadow: 0 6px 14px rgba(24, 58, 45, 0.25);
      transform: scale(1.01);
    }

    button:disabled {
      background: #9bb8ac;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .error {
      color: #D9534F;
      /* Soft Red */
      font-size: 14px;
      margin-top: 16px;
      display: none;
      background: #FDE8E7;
      padding: 10px 14px;
      border-radius: 10px;
      border-left: 4px solid #D9534F;
    }

    /* ----- footer ----- */
    .footer {
      margin-top: auto;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #E5E7EB;
      background: #FFFFFF;
    }

    .footer-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #6B7280;
    }

    .footer-content .afristay {
      font-weight: 700;
      color: #183A2D;
    }

    .footer-content .afristay span {
      color: #C8A86B;
    }

    /* ----- responsive ----- */
    @media (max-width: 640px) {
      .navbar {
        padding: 12px 16px;
        flex-wrap: wrap;
      }

      .logo-text {
        font-size: 1.4rem;
      }

      .logo-image {
        height: 32px;
      }

      .nav-link {
        font-size: 13px;
        padding: 6px 12px;
      }

      .card {
        padding: 32px 24px;
      }

      .card h1 {
        font-size: 22px;
      }

      .card-header .shield {
        width: 52px;
        height: 52px;
        line-height: 52px;
        font-size: 22px;
      }

      .footer {
        padding: 16px;
      }

      .footer-content {
        font-size: 12px;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 24px 16px;
      }

      .navbar {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .nav-right {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <!-- ===== STICKY NAVIGATION ===== -->
  <nav class="navbar">
    <a href="#" class="logo-link" id="logoLink">
      <!-- === REPLACE THE SRC BELOW WITH YOUR ACTUAL LOGO IMAGE URL === -->
      <img 
        src="chatgpt image jul 29, 2026, 01_06_15 pm.png" 
        alt="Afristay Logo" 
        class="logo-image" 
        id="logoImage"
      />
      <span class="logo-text">AFRI<span>STAY</span></span>
    </a>

    <div class="nav-right">
      <a href="login.html" class="nav-link">Staff Login</a>
      <a href="signup-hotel.html" class="nav-link primary">Register Hotel</a>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <div class="card">
      <div class="card-header">
        <div class="shield">🛡️</div>
        <h1>Admin Access</h1>
        <p class="subtitle">Platform administration — hotel approvals</p>
        <span class="badge-admin">Restricted Access</span>
      </div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="admin@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">

        <button type="submit" id="submitBtn">Log In</button>
        <p class="error" id="errorMsg"></p>
      </form>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-content">
      <span>Powered by</span>
      <span class="afristay">AFRI<span>STAY</span></span>
      <span>• Hotel Management Platform</span>
    </div>
  </footer>

  <script src="js/supabase-config.js"></script>
  <script>
    // ---- Logo image handler ----
    const logoImage = document.getElementById('logoImage');
    const logoLink = document.getElementById('logoLink');

    if (logoImage) {
      logoImage.addEventListener('load', function() {
        logoLink.classList.add('has-image');
      });
      logoImage.addEventListener('error', function() {
        logoLink.classList.remove('has-image');
        this.style.display = 'none';
      });
      if (logoImage.complete && logoImage.naturalWidth > 0) {
        logoLink.classList.add('has-image');
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ 
          email, 
          password 
        });
        if (error) throw error;

        const { data: adminRecord, error: adminError } = await supabaseClient
          .from("platform_admins")
          .select("id")
          .eq("auth_user_id", data.user.id)
          .single();

        if (adminError || !adminRecord) {
          await supabaseClient.auth.signOut();
          throw new Error("This account does not have admin access.");
        }

        window.location.href = "admin-dashboard.html";

      } catch (err) {
        errorMsg.textContent = err.message || "Login failed.";
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    });
  </script>

</body>
</html>
