<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Housekeeping — Afristay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: #FAF9F6;
      color: #1F2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ----- sticky navigation bar ----- */
    .navbar {
      position: sticky;
      top: 0;
      width: 100%;
      background: #FFFFFF;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #E5E7EB;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      gap: 12px;
    }

    .hotel-brand {
      display: flex;
      flex-direction: column;
    }

    .hotel-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #183A2D;
      line-height: 1.2;
    }

    .hotel-role {
      font-size: 12px;
      color: #9CA3AF;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-user {
      font-size: 14px;
      font-weight: 500;
      color: #1F2937;
    }

    .nav-user span {
      color: #C8A86B;
      font-weight: 600;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #E5E7EB;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      color: #1F2937;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #183A2D;
      color: #FAF9F6;
      border-color: #183A2D;
    }

    /* ----- main content ----- */
    main {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 32px;
      width: 100%;
    }

    /* ----- section header ----- */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #183A2D;
    }

    .btn-primary {
      background: #183A2D;
      color: #FAF9F6;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(24, 58, 45, 0.15);
    }

    .btn-primary:hover {
      background: #0f2b21;
      box-shadow: 0 6px 14px rgba(24, 58, 45, 0.25);
      transform: scale(1.02);
    }

    .btn-primary.small {
      padding: 8px 16px;
      font-size: 12px;
    }

    /* ----- task grid ----- */
    .task-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 32px;
    }

    .task-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px 22px;
      border: 1px solid #E5E7EB;
      box-shadow: 0 2px 8px rgba(24, 58, 45, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      transition: all 0.2s;
    }

    .task-card:hover {
      box-shadow: 0 8px 24px rgba(24, 58, 45, 0.06);
      border-color: #C8A86B;
    }

    .task-info .room-num {
      font-size: 18px;
      font-weight: 700;
      color: #183A2D;
    }

    .task-info .task-meta {
      font-size: 13px;
      color: #6B7280;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .task-info .task-notes {
      font-size: 13px;
      color: #6B7280;
      margin-top: 4px;
      font-style: italic;
      background: #FAF9F6;
      padding: 4px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    /* ----- badges ----- */
    .badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.pending {
      background: #FEF3C7;
      color: #D4A017;
    }

    .badge.in_progress {
      background: #DBEAFE;
      color: #183A2D;
    }

    .badge.done {
      background: #DCFCE7;
      color: #2E7D32;
    }

    .badge.cleaning {
      background: #FEF3C7;
      color: #D4A017;
    }

    .badge.maintenance {
      background: #FEE2E2;
      color: #D9534F;
    }

    .badge.inspection {
      background: #DBEAFE;
      color: #183A2D;
    }

    /* ----- task actions ----- */
    .task-actions {
      display: flex;
      gap: 8px;
    }

    .task-actions button {
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .task-actions button:hover {
      transform: scale(1.02);
    }

    .btn-start {
      background: #DBEAFE;
      color: #183A2D;
    }

    .btn-start:hover {
      background: #183A2D;
      color: #FAF9F6;
    }

    .btn-done {
      background: #DCFCE7;
      color: #2E7D32;
    }

    .btn-done:hover {
      background: #2E7D32;
      color: #FAF9F6;
    }

    /* ----- empty states ----- */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: #9CA3AF;
      font-size: 15px;
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #E5E7EB;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9CA3AF;
    }

    /* ----- modal ----- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #E5E7EB;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.15);
    }

    .modal h3 {
      font-size: 22px;
      font-weight: 700;
      color: #183A2D;
      margin-bottom: 20px;
    }

    .modal label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 5px;
      margin-top: 16px;
    }

    .modal input,
    .modal select,
    .modal textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      background: #FAF9F6;
      transition: border 0.2s, box-shadow 0.2s;
      color: #1F2937;
      font-family: inherit;
    }

    .modal input:focus,
    .modal select:focus,
    .modal textarea:focus {
      outline: none;
      border-color: #183A2D;
      box-shadow: 0 0 0 3px rgba(24, 58, 45, 0.08);
      background: #FFFFFF;
    }

    .modal textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #FAF9F6;
      border: 1px solid #E5E7EB;
      color: #1F2937;
    }

    .btn-cancel:hover {
      background: #F3F4F6;
    }

    .btn-confirm {
      background: #183A2D;
      color: #FAF9F6;
      border: none;
      box-shadow: 0 4px 10px rgba(24, 58, 45, 0.15);
    }

    .btn-confirm:hover {
      background: #0f2b21;
      box-shadow: 0 6px 14px rgba(24, 58, 45, 0.25);
      transform: scale(1.02);
    }

    /* ----- footer ----- */
    .footer {
      margin-top: 48px;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #E5E7EB;
      background: #FFFFFF;
    }

    .footer-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #6B7280;
    }

    .footer-content .afristay {
      font-weight: 700;
      color: #183A2D;
    }

    .footer-content .afristay span {
      color: #C8A86B;
    }

    /* ----- responsive ----- */
    @media (max-width: 768px) {
      .navbar {
        padding: 12px 16px;
        flex-wrap: wrap;
      }

      .hotel-name {
        font-size: 1.1rem;
      }

      main {
        padding: 16px;
      }

      .task-card {
        padding: 14px 16px;
      }

      .task-info .room-num {
        font-size: 16px;
      }

      .modal {
        padding: 24px;
        margin: 16px;
      }

      .footer {
        padding: 16px;
      }

      .footer-content {
        font-size: 12px;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 480px) {
      .task-card {
        flex-direction: column;
        align-items: stretch;
      }

      .task-actions {
        justify-content: flex-start;
        margin-top: 8px;
      }

      .task-actions button {
        flex: 1;
        text-align: center;
      }

      .section-header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .section-header .btn-primary {
        width: 100%;
        text-align: center;
      }

      .nav-user {
        font-size: 12px;
      }

      .btn-logout {
        font-size: 12px;
        padding: 6px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== STICKY NAVIGATION ===== -->
  <nav class="navbar">
    <div class="hotel-brand">
      <div class="hotel-name" id="hotelNameLabel">Loading...</div>
      <div class="hotel-role">Housekeeping</div>
    </div>

    <div class="nav-right">
      <div class="nav-user" id="staffNameLabel">Loading...</div>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <div class="section-header">
      <h2>Active Tasks</h2>
      <button class="btn-primary" onclick="openTaskModal()">+ Log Task</button>
    </div>
    <div class="task-grid" id="activeTasksGrid">
      <div class="loading">Loading tasks...</div>
    </div>

    <div class="section-header">
      <h2>Recently Completed</h2>
    </div>
    <div class="task-grid" id="doneTasksGrid">
      <div class="loading">Loading...</div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-content">
      <span>Powered by</span>
      <span class="afristay">AFRI<span>STAY</span></span>
      <span>• Hotel Management Platform</span>
    </div>
  </footer>

  <!-- LOG TASK MODAL -->
  <div class="modal-overlay" id="taskModalOverlay">
    <div class="modal">
      <h3>Log a Task</h3>
      <form id="taskForm">
        <label>Room</label>
        <select id="taskRoom" required></select>

        <label>Task Type</label>
        <select id="taskType" required>
          <option value="cleaning">Cleaning</option>
          <option value="inspection">Inspection</option>
          <option value="maintenance">Maintenance Issue</option>
        </select>

        <label>Notes</label>
        <textarea id="taskNotes" placeholder="e.g. AC not cooling, leaking tap..."></textarea>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
          <button type="submit" class="btn-confirm">Log Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script>
    let currentStaff = null;
    let hotelName = '';

    async function init() {
      currentStaff = await requireAuth(["housekeeper", "manager"]);
      if (!currentStaff) return;

      // Fetch hotel name
      const { data: hotel, error: hotelError } = await supabaseClient
        .from("hotels")
        .select("name")
        .eq("id", currentStaff.hotel_id)
        .single();

      if (!hotelError && hotel) {
        hotelName = hotel.name;
        document.getElementById("hotelNameLabel").textContent = hotelName;
      } else {
        document.getElementById("hotelNameLabel").textContent = "Hotel";
      }

      document.getElementById("staffNameLabel").innerHTML = 
        `${currentStaff.full_name} <span>— ${capitalize(currentStaff.role)}</span>`;

      await loadRoomOptions();
      await loadTasks();
    }

    // ============ ROOM OPTIONS FOR MODAL ============
    async function loadRoomOptions() {
      const { data: rooms } = await supabaseClient
        .from("rooms")
        .select("id, room_number, room_type")
        .eq("hotel_id", currentStaff.hotel_id)
        .order("room_number");

      const select = document.getElementById("taskRoom");
      select.innerHTML = (rooms || []).map(r => 
        `<option value="${r.id}">Room ${r.room_number} (${capitalize(r.room_type)})</option>`
      ).join("");
    }

    // ============ LOAD TASKS ============
    async function loadTasks() {
      const { data: logs, error } = await supabaseClient
        .from("housekeeping_logs")
        .select(`
          id, task, status, notes, logged_at,
          rooms!inner ( room_number, hotel_id )
        `)
        .eq("rooms.hotel_id", currentStaff.hotel_id)
        .order("logged_at", { ascending: false });

      const activeGrid = document.getElementById("activeTasksGrid");
      const doneGrid = document.getElementById("doneTasksGrid");

      if (error) {
        activeGrid.innerHTML = `<div class="empty-state">Error loading tasks.</div>`;
        doneGrid.innerHTML = "";
        return;
      }

      const active = logs.filter(l => l.status !== "done");
      const done = logs.filter(l => l.status === "done").slice(0, 10);

      activeGrid.innerHTML = active.length
        ? active.map(renderTaskCard).join("")
        : `<div class="empty-state">No active tasks right now.</div>`;

      doneGrid.innerHTML = done.length
        ? done.map(renderTaskCard).join("")
        : `<div class="empty-state">Nothing completed yet.</div>`;
    }

    function renderTaskCard(log) {
      const timeAgo = new Date(log.logged_at).toLocaleString("en-GB", { 
        day: "2-digit", 
        month: "short", 
        hour: "2-digit", 
        minute: "2-digit" 
      });

      return `
        <div class="task-card">
          <div class="task-info">
            <div class="room-num">Room ${log.rooms?.room_number || "—"}</div>
            <div class="task-meta">
              <span class="badge ${log.task}">${capitalize(log.task)}</span>
              <span class="badge ${log.status}">${capitalize(log.status.replace("_", " "))}</span>
              <span>• ${timeAgo}</span>
            </div>
            ${log.notes ? `<div class="task-notes">${log.notes}</div>` : ""}
          </div>
          <div class="task-actions">
            ${log.status === "pending" ? `<button class="btn-start" onclick="updateTaskStatus('${log.id}', 'in_progress')">Start</button>` : ""}
            ${log.status === "in_progress" ? `<button class="btn-done" onclick="updateTaskStatus('${log.id}', 'done')">Mark Done</button>` : ""}
          </div>
        </div>
      `;
    }

    // ============ UPDATE TASK STATUS ============
    async function updateTaskStatus(logId, newStatus) {
      const { data: log } = await supabaseClient
        .from("housekeeping_logs")
        .select("room_id, task")
        .eq("id", logId)
        .single();

      const { error } = await supabaseClient
        .from("housekeeping_logs")
        .update({ status: newStatus })
        .eq("id", logId);

      if (error) {
        alert("Failed to update task.");
        return;
      }

      if (newStatus === "done" && log?.task === "cleaning") {
        await supabaseClient.from("rooms").update({ status: "available" }).eq("id", log.room_id);
      }

      if (newStatus === "in_progress" && log?.task === "maintenance") {
        await supabaseClient.from("rooms").update({ status: "maintenance" }).eq("id", log.room_id);
      }

      if (newStatus === "done" && log?.task === "maintenance") {
        await supabaseClient.from("rooms").update({ status: "available" }).eq("id", log.room_id);
      }

      await loadTasks();
    }

    // ============ LOG NEW TASK ============
    function openTaskModal() {
      document.getElementById("taskModalOverlay").classList.add("open");
    }

    function closeTaskModal() {
      document.getElementById("taskModalOverlay").classList.remove("open");
      document.getElementById("taskForm").reset();
    }

    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const room_id = document.getElementById("taskRoom").value;
      const task = document.getElementById("taskType").value;
      const notes = document.getElementById("taskNotes").value.trim() || null;

      const { error } = await supabaseClient.from("housekeeping_logs").insert({
        room_id,
        staff_id: currentStaff.id,
        task,
        status: "pending",
        notes,
      });

      if (error) {
        alert("Failed to log task: " + error.message);
        return;
      }

      closeTaskModal();
      await loadTasks();
    });

    function capitalize(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function logout() {
      if (confirm("Log out of your account?")) {
        window.location.href = "login.html";
      }
    }

    init();
  </script>

</body>
</html>
